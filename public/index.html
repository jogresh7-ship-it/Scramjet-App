<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scramjet</title>

    <link rel="shortcut icon" content="favicon.webp" />

    <!-- Scramjet & BareMux Scripts -->
    <script src="/scram/scramjet.all.js"></script>
    <script src="/baremux/index.js"></script>
    <script src="register-sw.js" defer></script>
    <script src="search.js" defer></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">

    <style>
        *:not(.fas) {
            font-family: "Inter", "Roboto", system-ui, -apple-system, sans-serif !important;
        }

        body {
            margin: 0;
            background: #111;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow: hidden;
        }

        html {
            background: radial-gradient(at bottom, #111111, #000000);
            background-size: cover;
            background-attachment: fixed;
        }

        /* Set iframe z-index above background text so users can interact directly with the loaded site */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 1;
            border: none;
        }

        iframe.viewframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 1;
            border: none;
            display: none;
            background-color: #111;
        }

        .viewframe.active {
            display: block;
        }

        #sj-frame {
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #111;
            z-index: 1;
        }

        .tab.active {
            background: #96969638;
        }

        .backgroundtext {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            user-select: none;
            mix-blend-mode: overlay;
        }

        .backgroundtext h1 {
            color: rgba(255, 255, 255, 1);
            font-weight: bold;
            font-size: 75px;
            opacity: 0.5;
            margin-bottom: -10px;
        }

        .backgroundtext p {
            color: rgba(255, 255, 255, 1);
            font-size: 20px;
            opacity: 0.5;
            text-align: center;
        }

        form {
            justify-content: center;
            text-align: center;
            margin-top: 15px;
            width: 100%;
            display: flex;
            flex: 0.972;
        }

        form input {
            height: 20px;
            padding: 10px 20px;
            background: #36363638;
            backdrop-filter: blur(10px);
            border: 2px solid transparent;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.3), 0 16px 32px rgba(0, 0, 0, 0.12);
            color: white;
            border-radius: 150px;
            transition: 0.2s;
            font-size: 16px;
            margin-left: 5px;
            margin-right: 5px;
            width: 100%;
            outline: none;
        }

        form input:focus {
            background: #5e5e5e38;
            outline: none;
            border: none;
            border-radius: 6px;
        }

        /* Controls sit above iframe (z-index: 100) */
        .webcontrols {
            background: #36363638;
            padding: 15px;
            border-radius: 25px;
            margin: 10px;
            border: 2px solid transparent;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.3), 0 16px 32px rgba(0, 0, 0, 0.12);
            scale: 1;
            width: 80%;
            padding-right: 0px;
            padding-left: 0px;
            backdrop-filter: blur(10px);
            display: inline-block;
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            transition: 0.4s;
            z-index: 100;
        }

        form button {
            height: 40px;
            padding: 10px 10px;
            display: none;
            color: white;
            background: #36363638;
            backdrop-filter: blur(10px);
            border: 2px solid transparent;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.3), 0 16px 32px rgba(0, 0, 0, 0.12);
            border-radius: 500px;
            width: 20px;
            text-align: center;
        }

        .maincontrols {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-top: -10px;
        }

        button {
            height: 40px;
            padding: 10px 10px;
            color: white;
            background: #36363638;
            backdrop-filter: blur(10px);
            border: 2px solid transparent;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.3), 0 16px 32px rgba(0, 0, 0, 0.12);
            border-radius: 500px;
            width: 40px;
            text-align: center;
            transition: 0.2s;
            cursor: pointer;
            margin: 10px;
            vertical-align: middle;
        }

        .leftcontrols,
        .rightcontrols {
            width: max-content;
            margin-top: 5px;
        }

        .leftcontrols button,
        .rightcontrols button {
            margin-right: 2px;
            margin-left: 2px;
        }

        button:hover {
            background: #5e5e5e38;
        }

        .tabs {
            display: flex;
            justify-content: left;
            flex-direction: row;
            margin: 10px;
            margin-top: 0;
        }

        .tab {
            height: 20px;
            padding: 10px 20px;
            color: white;
            background: #36363638;
            backdrop-filter: blur(10px);
            border: 2px solid transparent;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.3), 0 16px 32px rgba(0, 0, 0, 0.12);
            border-radius: 500px;
            width: 160px;
            text-align: center;
            transition: 0.2s;
            cursor: pointer;
            display: flex;
            margin: 5px;
            overflow: hidden;
            align-items: center;
            position: relative;
        }

        .tab img {
            width: 16px;
            height: 16px;
            min-width: 16px;
            min-height: 16px;
            object-fit: contain;
            border-radius: 2px;
            margin-right: 8px;
        }

        .tabs button {
            margin: 5px;
        }

        .tab i {
            position: absolute;
            right: 6%;
            top: 50%;
            transform: translateY(-50%);
            transition: 0.2s;
            font-size: 13px;
        }

        .tab i:hover {
            color: rgb(211, 125, 125);
        }

        .tab:hover {
            background: #5e5e5e38;
        }

        .tab span {
            text-align: left;
            width: 70%;
            overflow: hidden;
            mask-image: linear-gradient(to right, black 70%, transparent 100%);
            font-size: 14px;
            white-space: nowrap;
        }

        .loader {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid rgb(255, 255, 255, 1);
            border-top-color: transparent;
            border-right-color: transparent;
            animation: rot1 0.5s linear infinite;
        }

        @keyframes rot1 {
            to {
                transform: rotate(360deg);
            }
        }

        #sj-error {
            color: #ff6666 !important;
            white-space: pre-wrap;
        }

        #sj-error-code {
            font-size: 12px;
            color: #fff;
            font-family: "Courier New", Courier, monospace;
        }

        /* Position the expand down button at top center when search bar is hidden */
        .showcontrols {
            z-index: 100;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
        }
    </style>
</head>

<body>

    <div class="webcontrols">
        <div class="tabs">
            <button id="nt" onclick="newTab()"><i class="fas fa-plus"></i></button>
        </div>
        <div class="maincontrols">
            <div class="leftcontrols">
                <button onclick="b()"><i class="fas fa-chevron-left"></i></button>
                <button onclick="f()"><i class="fas fa-chevron-right"></i></button>
                <button onclick="r()"><i class="fas fa-rotate-right"></i></button>
            </div>
            <form action="" id="sj-form">
                <input
                    id="sj-search-engine"
                    value="https://duckduckgo.com/?q=%s"
                    type="hidden"
                />
                <input type="text" id="sj-address" placeholder="Search with DuckDuckGo or enter a URL here" />
                <button id="submit" type="submit">Go</button>
            </form>
            <div class="rightcontrols">
                <button onclick="full()"><i class="fas fa-external-link"></i></button>
                <button onclick="hide()"><i class="fas fa-chevron-up"></i></button>
            </div>
        </div>
    </div>

    <button class="showcontrols" onclick="show()" style="opacity: 0; position: fixed; display: none; transition: 0.2s;">
        <i class="fas fa-chevron-down"></i>
    </button>

    <div class="backgroundtext">
        <h1>Scramjet</h1>
        <p>made by frutiger | built for frutiger-os</p>
        <p id="sj-error"></p>
        <pre id="sj-error-code"></pre>
    </div>

    <script>
        "use strict";

        const form = document.getElementById("sj-form");
        const address = document.getElementById("sj-address");
        const searchEngine = document.getElementById("sj-search-engine");
        const error = document.getElementById("sj-error");
        const errorCode = document.getElementById("sj-error-code");

        let scramjet = null;
        if (typeof $scramjetLoadController === "function") {
            const { ScramjetController } = $scramjetLoadController();
            scramjet = new ScramjetController({
                files: {
                    wasm: "/scram/scramjet.wasm.wasm",
                    all: "/scram/scramjet.all.js",
                    sync: "/scram/scramjet.sync.js",
                },
            });
            scramjet.init();
        }

        let connection = null;
        if (typeof BareMux !== "undefined") {
            connection = new BareMux.BareMuxConnection("/baremux/worker.js");
        }

        const se = localStorage.getItem("nOS_searchEngine") || "https://duckduckgo.com/?q=";
        const bar = document.getElementById("sj-address");

        if (se.includes("duckduckgo.com")) {
            bar.placeholder = "Search with DuckDuckGo or enter a URL here";
        } else if (se.includes("google.com")) {
            bar.placeholder = "Search with Google or enter a URL here";
        } else if (se.includes("bing.com")) {
            bar.placeholder = "Search with Bing or enter a URL here";
        } else if (se.includes("startpage.com")) {
            bar.placeholder = "Search with Startpage or enter a URL here";
        } else if (se.includes("qwant.com")) {
            bar.placeholder = "Search with Qwant or enter a URL here";
        } else {
            bar.placeholder = "Search with DuckDuckGo or enter a URL here";
        }

        const tabCont = document.querySelector(".tabs");

        let bTabs = [];
        let aTab = 0;
        let tabCounter = 1;

        function newTab() {
            const nTab = {
                id: tabCounter++,
                title: "New Tab",
                url: "",
                history: [],
                historyIndex: -1,
                sjFrame: null
            };

            bTabs.push(nTab);
            if (!tabCont) return;

            const ntBtn = document.getElementById('nt');

            const tabElement = document.createElement("div");
            tabElement.classList.add("tab");
            tabElement.dataset.tabId = nTab.id;
            tabElement.innerHTML = `<img id="fav" data-fav-id="${nTab.id}" src="https://www.google.com/s2/favicons?domain=duckduckgo.com&sz=64" alt="favicon"><span class="btitle">New Tab</span> <div class="closetab"><i class="fas fa-times"></i></div>`;

            tabElement.addEventListener("click", (e) => {
                if (!e.target.closest(".closetab")) {
                    switchTab(nTab.id);
                }
            });

            const closebtn = tabElement.querySelector(".closetab");
            closebtn.addEventListener("click", (e) => {
                e.stopPropagation();
                closeTab(nTab.id);
            });

            tabCont.insertBefore(tabElement, ntBtn);

            let tabFrameElement;
            if (scramjet) {
                nTab.sjFrame = scramjet.createFrame();
                tabFrameElement = nTab.sjFrame.frame;
            } else {
                tabFrameElement = document.createElement("iframe");
            }

            tabFrameElement.classList.add("viewframe");
            tabFrameElement.dataset.frameId = nTab.id;
            tabFrameElement.id = "sj-frame";

            document.body.appendChild(tabFrameElement);

            switchTab(nTab.id);
        }

        function switchTab(tId) {
            aTab = tId;

            document.querySelectorAll(".tab").forEach(tab => {
                tab.classList.toggle("active", parseInt(tab.dataset.tabId) === tId);
            });

            document.querySelectorAll(".viewframe").forEach(frame => {
                frame.classList.toggle("active", parseInt(frame.dataset.frameId) === tId);
            });

            const cTab = bTabs.find(t => t.id === tId);
            if (cTab) {
                const input = document.getElementById("sj-address");
                if (input) input.value = cTab.url;
            }
        }

        function closeTab(tId) {
            if (bTabs.length === 1) {
                return;
            }

            const tIndex = bTabs.findIndex((t) => t.id === tId);
            if (tIndex === -1) return;

            bTabs.splice(tIndex, 1);

            const tEl = document.querySelector(`.tab[data-tab-id="${tId}"]`);
            const frame = document.querySelector(`.viewframe[data-frame-id="${tId}"]`);

            if (tEl) tEl.remove();
            if (frame) frame.remove();

            if (aTab === tId) {
                const newATab = bTabs[Math.max(0, tIndex - 1)];
                if (newATab) {
                    switchTab(newATab.id);
                }
            }
        }

        form.addEventListener("submit", (e) => {
            e.preventDefault();
            const inp = document.getElementById("sj-address");
            nav(inp.value);
        });

        function nav(i) {
            if (!i.trim()) return;

            let url = i.trim();

            if (typeof search === "function") {
                url = search(url, searchEngine.value);
            } else {
                if (!url.includes(".") || url.includes(" ")) {
                    const engine = localStorage.getItem("nOS_searchEngine") || "https://duckduckgo.com/?q=";
                    url = engine + encodeURIComponent(url);
                } else {
                    if (!url.startsWith("http://") && !url.startsWith("https://")) {
                        url = "https://" + url;
                    }
                }
            }

            const cTab = bTabs.find((t) => t.id === aTab);
            if (!cTab) return;

            cTab.history.push(url);
            cTab.historyIndex++;
            cTab.url = url;

            const loadC = document.querySelector(".backgroundtext");
            if (loadC) {
                loadC.style.display = "none";
            }

            go(url);
        }

        async function go(u) {
            try {
                if (typeof registerSW === "function") {
                    await registerSW();
                }
            } catch (err) {
                if (error) error.textContent = "Failed to register service worker.";
                if (errorCode) errorCode.textContent = err.toString();
                throw err;
            }

            let wispUrl =
                (location.protocol === "https:" ? "wss" : "ws") +
                "://" +
                location.host +
                "/wisp/";

            if (connection) {
                try {
                    if ((await connection.getTransport()) !== "/libcurl/index.mjs") {
                        await connection.setTransport("/libcurl/index.mjs", [
                            { websocket: wispUrl },
                        ]);
                    }
                } catch (e) {
                    console.warn("BareMux transport setup error:", e);
                }
            }

            const cTab = bTabs.find((t) => t.id === aTab);
            const favEl = document.querySelector(`#fav[data-fav-id="${aTab}"]`);
            const viewframe = document.querySelector(`.viewframe[data-frame-id="${aTab}"]`);
            if (!viewframe) return;

            const ubar = document.getElementById("sj-address");
            if (ubar) ubar.value = cTab ? cTab.url : u;
            if (favEl && cTab && cTab.url) {
                favEl.src = `https://www.google.com/s2/favicons?domain=${cTab.url}&sz=64`;
            }

            try {
                if (cTab && cTab.sjFrame) {
                    cTab.sjFrame.go(u);
                } else {
                    viewframe.src = u;
                }

                viewframe.onload = () => {
                    const tabEl = document.querySelector(`.tab[data-tab-id="${aTab}"]`);
                    let title = "Scramjet";
                    try {
                        const iframeDoc = viewframe.contentDocument || viewframe.contentWindow.document;
                        title = iframeDoc.title || new URL(cTab ? cTab.url : u).hostname;
                    } catch (e) {
                        if (cTab && cTab.url) {
                            try { title = new URL(cTab.url).hostname; } catch(err) { title = cTab.url; }
                        }
                    }

                    if (tabEl) {
                        const titleEl = tabEl.querySelector(".btitle");
                        if (titleEl) titleEl.textContent = title;
                    }
                };
            } catch (e) {
                console.error("Error loading page:", e);
                if (error) error.textContent = "There was an error while loading the page.";
                if (errorCode) errorCode.textContent = e.toString();
            }
        }

        function b() {
            const cTab = bTabs.find((t) => t.id === aTab);
            if (!cTab || cTab.historyIndex <= 0) return;

            cTab.historyIndex--;
            const u = cTab.history[cTab.historyIndex];
            cTab.url = u;

            go(u);
        }

        function f() {
            const cTab = bTabs.find((t) => t.id === aTab);
            if (!cTab || cTab.historyIndex >= cTab.history.length - 1) return;

            cTab.historyIndex++;
            const u = cTab.history[cTab.historyIndex];
            cTab.url = u;

            go(u);
        }

        function r() {
            const viewframe = document.querySelector(`.viewframe[data-frame-id="${aTab}"]`);
            if (viewframe) {
                const curl = viewframe.src;
                viewframe.src = curl;
            }
        }

        function full() {
            const viewframe = document.querySelector(`.viewframe[data-frame-id="${aTab}"]`);
            const cTab = bTabs.find((t) => t.id === aTab);
            if (!viewframe) return;

            const targetUrl = viewframe.src;
            const tabEl = document.querySelector(`.tab[data-tab-id="${aTab}"] .btitle`);
            const titleText = tabEl ? tabEl.textContent : (cTab ? cTab.title : "Scramjet");

            const popup = window.open("about:blank", "_blank");
            if (popup) {
                popup.document.write(`
                    <!DOCTYPE html>
                    <html lang="en">
                    <head>
                        <meta charset="UTF-8">
                        <meta name="viewport" content="width=device-width, initial-scale=1.0">
                        <title>${titleText}</title>
                        <style>
                            html, body {
                                margin: 0;
                                padding: 0;
                                width: 100%;
                                height: 100%;
                                overflow: hidden;
                                background: #111;
                            }
                            iframe {
                                width: 100vw;
                                height: 100vh;
                                border: none;
                                display: block;
                            }
                        </style>
                    </head>
                    <body>
                        <iframe src="${targetUrl}"></iframe>
                    </body>
                    </html>
                `);
                popup.document.close();
            }
        }

        /* Slide controls up off-screen so the website in the background can be used completely */
        function hide() {
            document.querySelector(".webcontrols").style.transform = "translate(-50%, -200%)";
            setTimeout(() => {
                document.querySelector(".webcontrols").style.display = "none";
                document.querySelector(".showcontrols").style.display = "block";
                setTimeout(() => {
                    document.querySelector(".showcontrols").style.opacity = "1";
                }, 1);
            }, 401);
        }

        /* Restore search bar controls over the website */
        function show() {
            document.querySelector(".showcontrols").style.opacity = "0";
            setTimeout(() => {
                document.querySelector(".showcontrols").style.display = "none";
                document.querySelector(".webcontrols").style.display = "inline-block";
                setTimeout(() => {
                    document.querySelector(".webcontrols").style.transform = "translateX(-50%)";
                }, 25);
            }, 201);
        }

        newTab();
    </script>
</body>

</html>
