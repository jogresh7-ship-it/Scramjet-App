<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scramjet</title>

    <link rel="shortcut icon" content="favicon.webp" />

    <!-- Scramjet & BareMux Scripts -->
    <script src="/scram/scramjet.all.js"></script>
    <script src="/baremux/index.js"></script>
    <script src="register-sw.js" defer></script>
    <script src="search.js" defer></script>

    <style>
        /* Custom TTF Font Definition */
        @font-face {
            font-family: 'GNFFont';
            src: url('APPFONT/gnf.regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        /* Universal Custom Font Rule applied globally across all elements & numbers */
        *, *::before, *::after,
        html, body, input, button, select, textarea, option, optgroup,
        h1, h2, h3, h4, h5, h6, p, span, a, div, iframe {
            font-family: 'GNFFont', sans-serif !important;
            font-variant-numeric: tabular-nums lining-nums;
        }

        body {
            margin: 0;
            background: transparent !important;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow: hidden;
        }

        html {
            background: transparent !important;
        }

        /* Keep viewframe transparent by default when empty, opaque white/dark when active site loads */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 1;
            border: none;
            background: transparent;
        }

        iframe.viewframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 1;
            border: none;
            display: none;
            background: transparent;
        }

        .viewframe.active {
            display: block;
        }

        .viewframe.loaded-site {
            background-color: #ffffff;
        }

        #sj-frame {
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .tab.active {
            background: rgba(150, 150, 150, 0.25);
        }

        .backgroundtext {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            user-select: none;
            mix-blend-mode: overlay;
        }

        .backgroundtext h1 {
            color: rgba(255, 255, 255, 1);
            font-weight: bold;
            font-size: 75px;
            opacity: 0.5;
            margin-bottom: -10px;
        }

        .backgroundtext p {
            color: rgba(255, 255, 255, 1);
            font-size: 20px;
            opacity: 0.5;
            text-align: center;
        }

        form {
            justify-content: center;
            text-align: center;
            margin-top: 15px;
            width: 100%;
            display: flex;
            flex: 0.972;
        }

        form input {
            height: 20px;
            padding: 10px 20px;
            background: rgba(54, 54, 54, 0.22);
            backdrop-filter: blur(10px);
            border: 2px solid transparent;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.3), 0 16px 32px rgba(0, 0, 0, 0.12);
            color: white;
            border-radius: 150px;
            transition: 0.2s;
            font-size: 16px;
            margin-left: 5px;
            margin-right: 5px;
            width: 100%;
            outline: none;
            font-family: 'GNFFont', sans-serif !important;
        }

        form input:focus {
            background: rgba(94, 94, 94, 0.35);
            outline: none;
            border: none;
            border-radius: 6px;
        }

        /* Controls sit above iframe (z-index: 100) */
        .webcontrols {
            background: rgba(54, 54, 54, 0.22);
            padding: 15px;
            border-radius: 25px;
            margin: 10px;
            border: 2px solid transparent;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.3), 0 16px 32px rgba(0, 0, 0, 0.12);
            scale: 1;
            width: 80%;
            padding-right: 0px;
            padding-left: 0px;
            backdrop-filter: blur(10px);
            display: inline-block;
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            transition: 0.4s;
            z-index: 100;
        }

        form button {
            height: 40px;
            padding: 10px 10px;
            display: none;
            color: white;
            background: rgba(54, 54, 54, 0.22);
            backdrop-filter: blur(10px);
            border: 2px solid transparent;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.3), 0 16px 32px rgba(0, 0, 0, 0.12);
            border-radius: 500px;
            width: 20px;
            text-align: center;
        }

        .maincontrols {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-top: -10px;
        }

        button {
            height: 40px;
            width: 40px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            background: rgba(54, 54, 54, 0.22);
            backdrop-filter: blur(10px);
            border: 2px solid transparent;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.3), 0 16px 32px rgba(0, 0, 0, 0.12);
            border-radius: 500px;
            text-align: center;
            transition: 0.2s;
            cursor: pointer;
            margin: 10px;
            vertical-align: middle;
            font-family: 'GNFFont', sans-serif !important;
        }

        /* SVG Control Icons Styling */
        button svg {
            width: 20px;
            height: 20px;
            stroke: #ffffff;
            fill: none;
            stroke-width: 3.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none;
            display: block;
        }

        .leftcontrols,
        .rightcontrols {
            width: max-content;
            margin-top: 5px;
        }

        .leftcontrols button,
        .rightcontrols button {
            margin-right: 2px;
            margin-left: 2px;
        }

        button:hover {
            background: rgba(94, 94, 94, 0.35);
        }

        .tabs {
            display: flex;
            justify-content: left;
            flex-direction: row;
            margin: 10px;
            margin-top: 0;
        }

        .tab {
            height: 20px;
            padding: 10px 20px;
            color: white;
            background: rgba(54, 54, 54, 0.22);
            backdrop-filter: blur(10px);
            border: 2px solid transparent;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.3), 0 16px 32px rgba(0, 0, 0, 0.12);
            border-radius: 500px;
            width: 160px;
            text-align: center;
            transition: 0.2s;
            cursor: pointer;
            display: flex;
            margin: 5px;
            overflow: hidden;
            align-items: center;
            position: relative;
            font-family: 'GNFFont', sans-serif !important;
        }

        .tab img#fav {
            width: 16px;
            height: 16px;
            min-width: 16px;
            min-height: 16px;
            object-fit: contain;
            border-radius: 2px;
            margin-right: 8px;
            display: none; /* Hidden until loaded with custom site favicon */
        }

        .tab img#fav[src]:not([src=""]) {
            display: block;
        }

        .tabs button {
            margin: 5px;
        }

        .tab .closetab {
            position: absolute;
            right: 6%;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            cursor: pointer;
        }

        .tab .closetab svg {
            width: 12px;
            height: 12px;
            stroke: #ffffff;
            fill: none;
            stroke-width: 3.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.85;
            transition: transform 0.2s ease, opacity 0.2s ease;
            display: block;
        }

        .tab .closetab:hover svg {
            opacity: 1;
            transform: scale(1.2);
        }

        .tab:hover {
            background: rgba(94, 94, 94, 0.35);
        }

        .tab span {
            text-align: left;
            width: 70%;
            overflow: hidden;
            mask-image: linear-gradient(to right, black 70%, transparent 100%);
            font-size: 14px;
            white-space: nowrap;
        }

        #sj-error {
            color: #ff6666 !important;
            white-space: pre-wrap;
        }

        #sj-error-code {
            font-size: 12px;
            color: #fff;
        }

        .showcontrols {
            z-index: 100;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
        }
    </style>
</head>

<body>

    <div class="webcontrols">
        <div class="tabs">
            <button id="nt" onclick="newTab()" aria-label="New Tab">
                <svg viewBox="0 0 24 24">
                    <line x1="12" y1="5" x2="12" y2="19"/>
                    <line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
            </button>
        </div>
        <div class="maincontrols">
            <div class="leftcontrols">
                <button onclick="b()" aria-label="Back">
                    <svg viewBox="0 0 24 24">
                        <path d="M15 19l-7-7 7-7"/>
                    </svg>
                </button>
                <button onclick="f()" aria-label="Forward">
                    <svg viewBox="0 0 24 24">
                        <path d="M9 5l7 7-7 7"/>
                    </svg>
                </button>
                <button onclick="r()" aria-label="Reload">
                    <svg viewBox="0 0 24 24">
                        <path d="M20 11A8 8 0 1 1 17.33 5.34L20 8"/>
                        <path d="M20 3v5h-5"/>
                    </svg>
                </button>
            </div>
            <form action="" id="sj-form">
                <input
                    id="sj-search-engine"
                    value="https://duckduckgo.com/?q=%s"
                    type="hidden"
                />
                <input type="text" id="sj-address" placeholder="Search with DuckDuckGo or enter a URL here" />
                <button id="submit" type="submit">Go</button>
            </form>
            <div class="rightcontrols">
                <button onclick="full()" aria-label="Open in New Tab">
                    <svg viewBox="0 0 24 24">
                        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                        <path d="M15 3h6v6"/>
                        <path d="M10 14L21 3"/>
                    </svg>
                </button>
                <button onclick="hide()" aria-label="Hide Controls">
                    <svg viewBox="0 0 24 24">
                        <path d="M18 15l-6-6-6 6"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <button class="showcontrols" onclick="show()" style="opacity: 0; position: fixed; display: none; transition: 0.2s;" aria-label="Show Controls">
        <svg viewBox="0 0 24 24">
            <path d="M6 9l6 6 6-6"/>
        </svg>
    </button>

    <div class="backgroundtext">
        <p id="sj-error"></p>
        <pre id="sj-error-code"></pre>
    </div>

    <script>
        "use strict";

        const form = document.getElementById("sj-form");
        const address = document.getElementById("sj-address");
        const searchEngine = document.getElementById("sj-search-engine");
        const error = document.getElementById("sj-error");
        const errorCode = document.getElementById("sj-error-code");

        let scramjet = null;
        if (typeof $scramjetLoadController === "function") {
            const { ScramjetController } = $scramjetLoadController();
            scramjet = new ScramjetController({
                files: {
                    wasm: "/scram/scramjet.wasm.wasm",
                    all: "/scram/scramjet.all.js",
                    sync: "/scram/scramjet.sync.js",
                },
            });
            scramjet.init();
        }

        let connection = null;
        if (typeof BareMux !== "undefined") {
            connection = new BareMux.BareMuxConnection("/baremux/worker.js");
        }

        const se = localStorage.getItem("nOS_searchEngine") || "https://duckduckgo.com/?q=";
        const bar = document.getElementById("sj-address");

        if (se.includes("duckduckgo.com")) {
            bar.placeholder = "Search with DuckDuckGo or enter a URL here";
        } else if (se.includes("google.com")) {
            bar.placeholder = "Search with Google or enter a URL here";
        } else if (se.includes("bing.com")) {
            bar.placeholder = "Search with Bing or enter a URL here";
        } else if (se.includes("startpage.com")) {
            bar.placeholder = "Search with Startpage or enter a URL here";
        } else if (se.includes("qwant.com")) {
            bar.placeholder = "Search with Qwant or enter a URL here";
        } else {
            bar.placeholder = "Search with DuckDuckGo or enter a URL here";
        }

        const tabCont = document.querySelector(".tabs");

        let bTabs = [];
        let aTab = 0;
        let tabCounter = 1;

        function newTab() {
            const nTab = {
                id: tabCounter++,
                title: "New Tab",
                url: "",
                history: [],
                historyIndex: -1,
                sjFrame: null
            };

            bTabs.push(nTab);
            if (!tabCont) return;

            const ntBtn = document.getElementById('nt');

            const tabElement = document.createElement("div");
            tabElement.classList.add("tab");
            tabElement.dataset.tabId = nTab.id;
            tabElement.innerHTML = `
                <img id="fav" data-fav-id="${nTab.id}" src="" alt="favicon">
                <span class="btitle">New Tab</span>
                <div class="closetab">
                    <svg viewBox="0 0 24 24">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </div>
            `;

            tabElement.addEventListener("click", (e) => {
                if (!e.target.closest(".closetab")) {
                    switchTab(nTab.id);
                }
            });

            const closebtn = tabElement.querySelector(".closetab");
            closebtn.addEventListener("click", (e) => {
                e.stopPropagation();
                closeTab(nTab.id);
            });

            tabCont.insertBefore(tabElement, ntBtn);

            let tabFrameElement;
            if (scramjet) {
                nTab.sjFrame = scramjet.createFrame();
                tabFrameElement = nTab.sjFrame.frame;
            } else {
                tabFrameElement = document.createElement("iframe");
            }

            tabFrameElement.classList.add("viewframe");
            tabFrameElement.dataset.frameId = nTab.id;
            tabFrameElement.id = "sj-frame";

            document.body.appendChild(tabFrameElement);

            switchTab(nTab.id);
        }

        function switchTab(tId) {
            aTab = tId;

            document.querySelectorAll(".tab").forEach(tab => {
                tab.classList.toggle("active", parseInt(tab.dataset.tabId) === tId);
            });

            document.querySelectorAll(".viewframe").forEach(frame => {
                frame.classList.toggle("active", parseInt(frame.dataset.frameId) === tId);
            });

            const cTab = bTabs.find(t => t.id === tId);
            const bgText = document.querySelector(".backgroundtext");

            if (cTab) {
                const input = document.getElementById("sj-address");
                if (input) input.value = cTab.url;

                // Show background text and transparent state if tab is empty
                if (!cTab.url) {
                    if (bgText) bgText.style.display = "block";
                } else {
                    if (bgText) bgText.style.display = "none";
                }
            }
        }

        function closeTab(tId) {
            if (bTabs.length === 1) {
                return;
            }

            const tIndex = bTabs.findIndex((t) => t.id === tId);
            if (tIndex === -1) return;

            bTabs.splice(tIndex, 1);

            const tEl = document.querySelector(`.tab[data-tab-id="${tId}"]`);
            const frame = document.querySelector(`.viewframe[data-frame-id="${tId}"]`);

            if (tEl) tEl.remove();
            if (frame) frame.remove();

            if (aTab === tId) {
                const newATab = bTabs[Math.max(0, tIndex - 1)];
                if (newATab) {
                    switchTab(newATab.id);
                }
            }
        }

        form.addEventListener("submit", (e) => {
            e.preventDefault();
            const inp = document.getElementById("sj-address");
            nav(inp.value);
        });

        function nav(i) {
            if (!i.trim()) return;

            let url = i.trim();

            if (typeof search === "function") {
                url = search(url, searchEngine.value);
            } else {
                if (!url.includes(".") || url.includes(" ")) {
                    const engine = localStorage.getItem("nOS_searchEngine") || "https://duckduckgo.com/?q=";
                    url = engine + encodeURIComponent(url);
                } else {
                    if (!url.startsWith("http://") && !url.startsWith("https://")) {
                        url = "https://" + url;
                    }
                }
            }

            const cTab = bTabs.find((t) => t.id === aTab);
            if (!cTab) return;

            cTab.history.push(url);
            cTab.historyIndex++;
            cTab.url = url;

            const loadC = document.querySelector(".backgroundtext");
            if (loadC) {
                loadC.style.display = "none";
            }

            go(url);
        }

        // Helper function to force custom font into embedded websites inside iframe
        function injectCustomFontToIframe(iframe) {
            try {
                const doc = iframe.contentDocument || (iframe.contentWindow && iframe.contentWindow.document);
                if (doc && doc.head) {
                    const fontStyle = doc.createElement('style');
                    fontStyle.textContent = `
                        @font-face {
                            font-family: 'GNFFont';
                            src: url('${window.location.origin}/APPFONT/gnf.regular.ttf') format('truetype');
                            font-weight: normal;
                            font-style: normal;
                        }
                        *, *::before, *::after, body, div, p, span, a, h1, h2, h3, h4, h5, h6, input, button, select, textarea {
                            font-family: 'GNFFont', sans-serif !important;
                            font-variant-numeric: tabular-nums lining-nums;
                        }
                    `;
                    doc.head.appendChild(fontStyle);
                }
            } catch (e) {
                console.warn("Cross-origin frame font injection limited by browser context:", e);
            }
        }

        async function go(u) {
            try {
                if (typeof registerSW === "function") {
                    await registerSW();
                }
            } catch (err) {
                if (error) error.textContent = "Failed to register service worker.";
                if (errorCode) errorCode.textContent = err.toString();
                throw err;
            }

            let wispUrl =
                (location.protocol === "https:" ? "wss" : "ws") +
                "://" +
                location.host +
                "/wisp/";

            if (connection) {
                try {
                    if ((await connection.getTransport()) !== "/libcurl/index.mjs") {
                        await connection.setTransport("/libcurl/index.mjs", [
                            { websocket: wispUrl },
                        ]);
                    }
                } catch (e) {
                    console.warn("BareMux transport setup error:", e);
                }
            }

            const cTab = bTabs.find((t) => t.id === aTab);
            const favEl = document.querySelector(`#fav[data-fav-id="${aTab}"]`);
            const viewframe = document.querySelector(`.viewframe[data-frame-id="${aTab}"]`);
            if (!viewframe) return;

            // Mark iframe as loaded so background becomes opaque website backdrop
            viewframe.classList.add("loaded-site");

            const ubar = document.getElementById("sj-address");
            if (ubar) ubar.value = cTab ? cTab.url : u;
            if (favEl && cTab && cTab.url) {
                favEl.src = `https://www.google.com/s2/favicons?domain=${cTab.url}&sz=64`;
            }

            try {
                if (cTab && cTab.sjFrame) {
                    cTab.sjFrame.go(u);
                } else {
                    viewframe.src = u;
                }

                viewframe.onload = () => {
                    injectCustomFontToIframe(viewframe);
                    const tabEl = document.querySelector(`.tab[data-tab-id="${aTab}"]`);
                    let title = "Scramjet";
                    try {
                        const iframeDoc = viewframe.contentDocument || viewframe.contentWindow.document;
                        title = iframeDoc.title || new URL(cTab ? cTab.url : u).hostname;
                    } catch (e) {
                        if (cTab && cTab.url) {
                            try { title = new URL(cTab.url).hostname; } catch(err) { title = cTab.url; }
                        }
                    }

                    if (tabEl) {
                        const titleEl = tabEl.querySelector(".btitle");
                        if (titleEl) titleEl.textContent = title;
                    }
                };
            } catch (e) {
                console.error("Error loading page:", e);
                if (error) error.textContent = "There was an error while loading the page.";
                if (errorCode) errorCode.textContent = e.toString();
            }
        }

        function b() {
            const cTab = bTabs.find((t) => t.id === aTab);
            if (!cTab || cTab.historyIndex <= 0) return;

            cTab.historyIndex--;
            const u = cTab.history[cTab.historyIndex];
            cTab.url = u;

            go(u);
        }

        function f() {
            const cTab = bTabs.find((t) => t.id === aTab);
            if (!cTab || cTab.historyIndex >= cTab.history.length - 1) return;

            cTab.historyIndex++;
            const u = cTab.history[cTab.historyIndex];
            cTab.url = u;

            go(u);
        }

        function r() {
            const viewframe = document.querySelector(`.viewframe[data-frame-id="${aTab}"]`);
            if (viewframe) {
                const curl = viewframe.src;
                viewframe.src = curl;
            }
        }

        function full() {
            const viewframe = document.querySelector(`.viewframe[data-frame-id="${aTab}"]`);
            const cTab = bTabs.find((t) => t.id === aTab);
            if (!viewframe) return;

            const targetUrl = viewframe.src;
            const tabEl = document.querySelector(`.tab[data-tab-id="${aTab}"] .btitle`);
            const titleText = tabEl ? tabEl.textContent : (cTab ? cTab.title : "Scramjet");

            const popup = window.open("about:blank", "_blank");
            if (popup) {
                popup.document.write(`
                    <!DOCTYPE html>
                    <html lang="en">
                    <head>
                        <meta charset="UTF-8">
                        <meta name="viewport" content="width=device-width, initial-scale=1.0">
                        <title>${titleText}</title>
                        <style>
                            @font-face {
                                font-family: 'GNFFont';
                                src: url('${window.location.origin}/APPFONT/gnf.regular.ttf') format('truetype');
                            }
                            html, body {
                                margin: 0;
                                padding: 0;
                                width: 100%;
                                height: 100%;
                                overflow: hidden;
                                background: #111;
                                font-family: 'GNFFont', sans-serif !important;
                            }
                            iframe {
                                width: 100vw;
                                height: 100vh;
                                border: none;
                                display: block;
                            }
                        </style>
                    </head>
                    <body>
                        <iframe src="${targetUrl}"></iframe>
                    </body>
                    </html>
                `);
                popup.document.close();
            }
        }

        function hide() {
            document.querySelector(".webcontrols").style.transform = "translate(-50%, -200%)";
            setTimeout(() => {
                document.querySelector(".webcontrols").style.display = "none";
                document.querySelector(".showcontrols").style.display = "inline-flex";
                setTimeout(() => {
                    document.querySelector(".showcontrols").style.opacity = "1";
                }, 1);
            }, 401);
        }

        function show() {
            document.querySelector(".showcontrols").style.opacity = "0";
            setTimeout(() => {
                document.querySelector(".showcontrols").style.display = "none";
                document.querySelector(".webcontrols").style.display = "inline-block";
                setTimeout(() => {
                    document.querySelector(".webcontrols").style.transform = "translateX(-50%)";
                }, 25);
            }, 201);
        }

        newTab();
    </script>
</body>

</html>
